<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monster Coin Crusher</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: #90EE90;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }
        .hidden { opacity: 0; pointer-events: none; }
        button {
            margin: 10px;
            padding: 15px 30px;
            font-size: 24px;
            background: #228B22;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        button:hover { background: #1F6B1F; }
        #title { font-size: 48px; color: #228B22; margin-bottom: 20px; }
        #monster {
            width: 200px;
            height: 200px;
            cursor: pointer;
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        #stats {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 20px;
            color: #228B22;
        }
        #upgrades {
            position: absolute;
            bottom: 20px;
            display: flex;
            gap: 10px;
        }
        .upgrade-btn {
            padding: 10px 15px;
            font-size: 16px;
        }
        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #90EE90;
            padding: 20px;
            border: 5px solid #228B22;
            border-radius: 15px;
            text-align: center;
            display: none;
        }
        .modal input, .modal button {
            margin: 10px;
            padding: 10px;
            font-size: 16px;
        }
        .close {
            position: absolute;
            top: 5px;
            right: 10px;
            font-size: 24px;
            color: red;
            cursor: pointer;
        }
        #saveCode {
            width: 300px;
            word-wrap: break-word;
            background: #fff;
            padding: 10px;
            border: 2px solid #228B22;
            border-radius: 5px;
        }
    </style>
</head>

<!-- Menu Screen -->
<div id="menuScreen" class="screen">
    <h1 style="font-size: 50px; color: #228B22;">Monster Coin Crusher</h1>

    <button id="creditsBtn">credits</button>
    <p style="position: absolute; bottom: 10px; font-size: 14px; color: #228B22;">
        made by leo (1_Ogamer)
    </p>
</div>
